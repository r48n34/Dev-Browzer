[package]
name = "dev-browzer"
version = "0.1.0"
description = "Synchronized responsive web application preview workbench"
authors = ["Dev Browzer contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[lib]
name = "dev_browzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["unstable", "devtools"] }
tauri-plugin-store = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
