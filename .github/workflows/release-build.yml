name: Build and release

on:
  push:
    branches:
      - build

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installers and create release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-${{ github.run_number }}
          releaseName: Dev Browzer build ${{ github.run_number }}
          releaseBody: Automated Windows build from commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
